name: Commodities Daily → Feishu

on:
  schedule:
    # HKT 08:00 = UTC 00:00, 週一至週五
    - cron: "0 21 * * 1-5"
  workflow_dispatch:   # 手動觸發（測試用）

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          FEISHU_APP_ID:              ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET:          ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID:             ${{ secrets.FEISHU_CHAT_ID }}
          FEISHU_THREAD_MESSAGE_ID:   ${{ secrets.FEISHU_THREAD_MESSAGE_ID }}
        run: python send_commodities.py

      - name: Upload PNG artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commodities-${{ github.run_id }}
          path: commodities.png
          retention-days: 7
