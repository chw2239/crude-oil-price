name: Commodities Daily → Feishu

on:
  schedule:
    # UTC 23:00 = HKT 07:00（隔天），每天
    - cron: "0 23 * * *"
  workflow_dispatch:   # 手動觸發（測試用）

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          FEISHU_APP_ID:            ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET:        ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID:           ${{ secrets.FEISHU_CHAT_ID }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
          FEISHU_BITABLE_TABLE_ID:  ${{ secrets.FEISHU_BITABLE_TABLE_ID }}
          FEISHU_DASHBOARD_URL:     ${{ secrets.FEISHU_DASHBOARD_URL }}
        run: python send_commodities.py
